syntax = "proto3";

package panelarr.jobs.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "panelarr.jobs.v1";

// The job and run model Panelarr's services share: a job is a piece of background work
// with an optional schedule, and each time it runs is a run, kept as history. Services
// expose them through their own APIs (for source plugins, SourcePluginService's job
// calls) with these messages, so a client can show every service's jobs the same way.
//
// The rules every service follows:
// - A job runs once at a time. Starting a running job fails with ALREADY_EXISTS, a
//   google.rpc.ErrorInfo with reason `ALREADY_RUNNING` (metadata `current_run_id`) and a
//   JobAlreadyRunning detail. A scheduled run that finds its job busy is recorded as
//   SKIPPED.
// - Unknown jobs and runs answer NOT_FOUND. Cancelling a run that isn't running, or of a
//   job that can't be cancelled, answers FAILED_PRECONDITION.
// - A run that was going on when the service stopped is marked FAILED ("interrupted").
// - Scheduled runs use the params' defaults. A run that leaves a param out gets its
//   default.

message Job {
  // Stable ID, such as `store-refresh`. Matches `^[a-z0-9][a-z0-9._-]*$`: never a `:`,
  // which HTTP paths would read as a custom verb (as in `:run`).
  string id = 1;
  string name = 2;
  string description = 3;
  Schedule schedule = 4;
  bool running = 5;
  // The running run, when `running`.
  string current_run_id = 6;
  JobRunSummary last_run = 7;
  // When the next scheduled run starts. Unset when the job only runs on request.
  google.protobuf.Timestamp next_run_at = 8;
  bool cancellable = 9;
  // What a run accepts as params.
  repeated JobParam params = 10;
  // A label to group jobs by, such as "Stores".
  string group = 11;
}

// When a job runs on its own. With neither `cron` nor `interval`, it only runs on
// request.
message Schedule {
  oneof kind {
    string cron = 1;
    google.protobuf.Duration interval = 2;
  }
  bool enabled = 3;
  // Where the schedule is configured, such as an environment variable.
  string source = 4;
}

message JobParam {
  string name = 1;
  // `bool`, `int`, `string` or `string_list` (comma-separated in a run's params).
  string type = 2;
  string description = 3;
  bool required = 4;
  // The value used when the param isn't given, if any.
  string default = 5;
  // The allowed values, when there is a fixed set. For a `string_list`, any subset.
  repeated string choices = 6;
}

enum JobRunStatus {
  JOB_RUN_STATUS_UNSPECIFIED = 0;
  JOB_RUN_STATUS_RUNNING = 1;
  JOB_RUN_STATUS_SUCCEEDED = 2;
  JOB_RUN_STATUS_FAILED = 3;
  JOB_RUN_STATUS_CANCELLED = 4;
  // The run didn't do its work, e.g. a scheduled run while another run was going on.
  JOB_RUN_STATUS_SKIPPED = 5;
}

enum JobTrigger {
  JOB_TRIGGER_UNSPECIFIED = 0;
  JOB_TRIGGER_SCHEDULE = 1;
  JOB_TRIGGER_MANUAL = 2;
  JOB_TRIGGER_STARTUP = 3;
  // The service started the run on its own while running, e.g. after a change it
  // reacts to.
  JOB_TRIGGER_SYSTEM = 4;
}

message JobRunSummary {
  string id = 1;
  string job_id = 2;
  JobRunStatus status = 3;
  JobTrigger trigger = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;
  // One line: the outcome, or the error.
  string message = 7;
  // What the run did, such as {"stores": 2, "updates": 5}.
  map<string, int64> counts = 8;
  // Who started a manual run.
  string triggered_by = 9;
}

message JobRun {
  JobRunSummary summary = 1;
  // The parameters it ran with.
  map<string, string> params = 2;
  // Warnings, errors and notable events, oldest first (at most 200).
  repeated JobRunNote notes = 3;
  // While running.
  JobProgress progress = 4;
}

message JobRunNote {
  google.protobuf.Timestamp at = 1;
  // `info`, `warn` or `error`.
  string level = 2;
  string message = 3;
  // What the note is about, such as a store or source ID.
  string ref = 4;
}

message JobProgress {
  string phase = 1;
  int64 done = 2;
  int64 total = 3;
  // What is counted, such as "sources".
  string unit = 4;
}

// Error detail of ALREADY_EXISTS when starting a job that is running.
message JobAlreadyRunning {
  string current_run_id = 1;
}
