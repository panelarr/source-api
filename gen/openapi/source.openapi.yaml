tags:
  - name: SourcePluginService
    description: |-
      SourcePluginService is the contract every Panelarr source plugin implements.

       A plugin serves one or more sources. Each source is a catalogue of series that can be
       browsed (popular, latest, search), and each series has chapters made of pages.

       Keys (series keys, chapter keys, page refs) are opaque strings chosen by the plugin.
       Callers store them and pass them back as they are, and never parse them.

       Errors use gRPC status codes. When a request fails because of the upstream source,
       the status carries a google.rpc.ErrorInfo whose `reason` is one of ErrorReason's
       names without the `ERROR_REASON_` prefix (for example `RATE_LIMITED`), and whose
       `domain` is `source.panelarr`. RATE_LIMITED may also carry a google.rpc.RetryInfo.
